name: Build Geode Mod

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows x64
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: MacOS

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android 32-bit
            os: ubuntu-latest
            target: Android32

          - name: Android 64-bit
            os: ubuntu-latest
            target: Android64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          target: ${{ matrix.config.target }}
          combine: true

  package:
    name: Combine all platform builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine .geode builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - name: Upload combined mod
        uses: actions/upload-artifact@v7
        with:
          name: Frame-Window-Counter-Multi-Platform
          path: ${{ steps.combine.outputs.build-output }}
